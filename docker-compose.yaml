name: msp-helper

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: max_hackathon_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
      POSTGRES_DB: ${DB_NAME:-max_sme_support}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    
    ports:
      - "127.0.0.1:5433:5432"

  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: max_hackathon_backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 8000:8000

      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-max_sme_support}

      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}

      INIT_DATA_MAX_AGE_SECONDS: ${INIT_DATA_MAX_AGE_SECONDS:-86400}

    depends_on:
      postgres_db:
        condition: service_healthy

    
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: max_hackathon_web
    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN:-:80}

    depends_on:
      backend_api:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config: