name: msp-helper

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: max_hackathon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Скопируйте .env.example в .env и задайте DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-max_sme_support}
    ports:
      - "127.0.0.1:5432:5432"   # только с этой машины (для DBeaver)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend_api:
    build: ./backend
    container_name: max_hackathon_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-max_sme_support}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      INIT_DATA_MAX_AGE_SECONDS: ${INIT_DATA_MAX_AGE_SECONDS:-86400}
    ports:
      - "127.0.0.1:8000:8000"   # для отладки API напрямую
    depends_on:
      postgres_db:
        condition: service_healthy

  # Caddy: раздаёт мини-приложение и проксирует /api на backend. Один origin -> CORS не нужен.
  web:
    build: ./frontend
    container_name: max_hackathon_web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend_api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
